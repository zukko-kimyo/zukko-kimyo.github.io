<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zukko Kimyo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Zukko Kimyo — 6–8-sinf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b2a5b; --blue:#1f5fd6; --sky:#e8f1fe; --green:#16a34a; --mint:#e7f8ee; --orange:#f59e0b; --purple:#7c3aed;
  --ink:#0f172a; --muted:#5b6b82; --line:#e3e9f2; --bg:#f6f9fd; --card:#fff; --r:18px;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 28px rgba(15,23,42,.07);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--f),system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.55}
h1,h2,h3,h4{font-family:var(--f),var(--f),sans-serif;letter-spacing:-.01em;margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}

/* header */
header.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f);font-weight:800;font-size:19px;color:var(--navy)}
.logo .mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--blue),#22c55e);display:grid;place-items:center;color:#fff;font-size:19px;box-shadow:0 4px 14px rgba(31,95,214,.35)}
.logo small{display:block;font:600 11px var(--f);color:var(--muted);letter-spacing:.02em}
nav.main{display:flex;gap:4px;margin-left:12px}
nav.main a{padding:8px 12px;border-radius:10px;font-weight:600;font-size:14.5px;color:#334155;white-space:nowrap}
nav.main a.on,nav.main a:hover{background:var(--sky);color:var(--blue)}
.spacer{flex:1}
.search{position:relative}
.search input{width:230px;border:1px solid var(--line);background:#f4f7fb;border-radius:12px;padding:9px 12px 9px 34px;font:500 14px var(--f);outline:none;transition:.2s}
.search input:focus{background:#fff;border-color:var(--blue);width:280px}
.search:before{content:"🔍";position:absolute;left:11px;top:8px;font-size:13px;opacity:.6;pointer-events:none;z-index:61}
.sres{position:absolute;right:0;top:44px;width:360px;max-height:420px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:none;padding:6px}
.sres.on{display:block}
.sres a{display:block;padding:9px 11px;border-radius:10px;font-size:14px}
.sres a:hover{background:var(--sky)}
.sres a small{color:var(--muted);display:block;font-size:12px}
.sres a[href]{display:flex;gap:10px;align-items:center}.sres a.sel{background:var(--sky);outline:2px solid #bcd3ff}.sres a.top{background:#f0f7ff}.sres a.muted{color:var(--muted);font-size:13px}
.snum{flex:none;min-width:30px;height:30px;padding:0 6px;border-radius:9px;display:grid;place-items:center;font:800 13px var(--f);color:#fff;background:#1f5fd6}.snum.g7{background:#16a34a}.snum.lab{background:#efe9ff;font-size:15px}.stx{min-width:0}
.lhead{display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}
.lnav{display:flex;align-items:center;gap:6px;background:#f4f7fb;border:1px solid var(--line);border-radius:14px;padding:4px}
.lnb{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font:700 22px/1 var(--f);color:var(--navy);background:#fff;border:1px solid var(--line);transition:.15s}
a.lnb:hover{background:var(--blue);color:#fff;border-color:var(--blue)}.lnb.off{opacity:.35}
.lpos{font:600 13.5px var(--f);color:var(--muted);padding:0 8px;white-space:nowrap}.lpos b{color:var(--navy)}
.fnav{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:4px;background:rgba(15,32,66,.92);backdrop-filter:blur(6px);color:#fff;border-radius:999px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.25);font:600 13.5px var(--f)}
.fnav a,.fnav .off{padding:8px 14px;border-radius:999px;color:#fff;white-space:nowrap}.fnav a:hover{background:rgba(255,255,255,.16)}.fnav .off{opacity:.35}.fnav b{padding:0 8px;font-weight:700;opacity:.85;white-space:nowrap}
.lesson-body{padding-bottom:70px}
@media(max-width:600px){.lhead .lnav{display:none}header.top .wrap{gap:8px}.lang button{padding:6px 8px}.search input{width:36px!important}.search input:focus{width:auto!important}.logo{white-space:nowrap;font-size:17px}.logo small{display:none}.fnav span{display:none}.fnav a,.fnav .off{padding:8px 16px;font-size:18px}}
.lang{display:flex;background:#eef2f8;border-radius:11px;padding:3px}
.lang button{border:0;background:none;padding:6px 11px;border-radius:9px;font-weight:700;font-size:13px;color:#64748b}
.lang button.on{background:#fff;color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.burger{display:none;border:0;background:#eef2f8;border-radius:10px;padding:8px 11px}

/* hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(1200px 500px at 85% -10%,#cfe3ff 0,transparent 60%),radial-gradient(800px 400px at -10% 110%,#d6f5e1 0,transparent 60%),linear-gradient(180deg,#f3f8ff,#f6f9fd)}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:56px 20px 48px}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:6px 12px;font:600 13px var(--f);color:var(--navy)}
.hero h1{font-size:46px;line-height:1.08;margin:16px 0 14px;color:var(--navy);font-weight:800}
.hero h1 span{background:linear-gradient(90deg,var(--blue),#16a34a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:17.5px;color:#41526b;max-width:560px;margin:0 0 24px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:13px;padding:12px 18px;font:700 15px var(--f);transition:.15s}
.btn.pri{background:var(--blue);color:#fff;box-shadow:0 6px 18px rgba(31,95,214,.3)}
.btn.pri:hover{transform:translateY(-1px)}
.btn.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.grn{background:var(--green);color:#fff;box-shadow:0 6px 18px rgba(22,163,74,.28)}
.stats{display:flex;gap:26px;margin-top:28px}
.stats b{display:block;font:800 26px var(--f);color:var(--navy)}
.stats span{font-size:13px;color:var(--muted)}
.hero-art{position:relative;height:340px;border-radius:26px;background:#0f1d33;box-shadow:0 20px 50px rgba(11,42,91,.25);overflow:hidden}
.hero-art .lab-host{height:100%}
.hero-art .lab-ui{display:none}
.hero-art .lab-hint{display:none}
.hero-art .badge3d{position:absolute;left:14px;top:14px;z-index:5;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:6px 10px;font:700 12px var(--f);backdrop-filter:blur(6px)}

/* sections */
section.blk{padding:40px 0}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}
.sec-h h2{font-size:28px;color:var(--navy)}
.sec-h p{margin:4px 0 0;color:var(--muted)}
.grades{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.gcard{position:relative;border-radius:24px;padding:26px;background:#fff;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line);transition:.2s;display:flex;gap:22px;align-items:center}
.gcard:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(15,23,42,.12)}
.gcard img{width:130px;border-radius:12px;box-shadow:0 8px 22px rgba(0,0,0,.18);flex:none}
.gcard h3{font-size:24px;color:var(--navy)}
.gcard .meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sky);color:var(--blue);border-radius:99px;padding:4px 10px;font:600 12.5px var(--f)}
.chip.g{background:var(--mint);color:var(--green)}
.chip.o{background:#fff4e0;color:#b45309}
.chip.p{background:#f1e9ff;color:var(--purple)}
.gcard p{margin:0;color:#475569;font-size:14.5px}

.feat{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.fcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.fcard .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--sky);margin-bottom:12px}
.fcard h4{font-size:16px;margin-bottom:6px}
.fcard p{margin:0;color:var(--muted);font-size:14px}

/* lesson list */
.page-h{background:linear-gradient(135deg,#0b2a5b,#1f5fd6);color:#fff;padding:34px 0 30px}
.page-h.g7{background:linear-gradient(135deg,#0b3b2e,#16a34a)}
.page-h.lab{background:linear-gradient(135deg,#1e1b4b,#7c3aed)}
.page-h.pt{background:linear-gradient(135deg,#0f3b47,#0e9aa7)}
.toolcard{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(135deg,#f0fbfc,#fff);transition:.15s}.toolcard:hover{border-color:#0e9aa7;transform:translateY(-1px)}.toolcard .ic{width:46px;height:46px;border-radius:12px;background:#d9f4f6;display:grid;place-items:center;font-size:24px;flex:none}.toolcard small{color:#0e7c86;font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.04em}.toolcard h4{margin:2px 0;color:var(--navy)}.toolcard p{margin:0;color:var(--muted);font-size:13.5px}.toolcard .go{margin-left:auto;font-size:20px;color:#0e9aa7}
.ptwrap{padding-top:18px;padding-bottom:40px}.ptbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.ptlbl{font-size:13px;color:var(--muted);padding:0 6px;align-self:center}
.ptfind{flex:1;min-width:200px;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font:500 14px var(--f);outline:none}.ptfind:focus{border-color:#0e9aa7}
.ptscroll{overflow-x:auto;padding-bottom:6px}
.ptgrid{display:grid;grid-template-columns:22px repeat(18,minmax(48px,1fr));gap:3px;min-width:940px;position:relative}
.ptgh{text-align:center;font:700 12px var(--f);color:var(--muted);padding:2px 0;line-height:1.1}.ptgh small{display:block;font-size:9.5px;font-weight:600;opacity:.8}.ptph{display:grid;place-items:center;font:700 12px var(--f);color:var(--muted)}.ptgh.hov,.ptph.hov{color:#0e9aa7}
.ptcell{position:relative;aspect-ratio:1/1.12;border:0;border-radius:7px;background:var(--c,#eee);padding:3px 4px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;transition:transform .12s,box-shadow .12s,opacity .2s;font-family:var(--f);color:#14213d;overflow:hidden}
.ptcell:hover{transform:scale(1.12);z-index:3;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.ptcell i{font-style:normal;font-size:9.5px;font-weight:700;opacity:.75}.ptcell b{font:800 17px/1 var(--f);text-align:center}.ptcell span{font-size:8.6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ptcell em{font-style:normal;font-size:8.3px;text-align:center;opacity:.7}
.ptcell.dim{opacity:.18}.ptcell.sel{outline:3px solid #0b2a5b;outline-offset:1px;z-index:2}.ptcell.ok{outline:3px solid #16a34a;animation:ptpop .5s}.ptcell.bad{outline:3px solid #dc2626;animation:ptshake .4s}
@keyframes ptpop{50%{transform:scale(1.25)}}@keyframes ptshake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.ptph2{background:repeating-linear-gradient(45deg,#fff3c4,#fff3c4 4px,#ffe7a3 4px,#ffe7a3 8px);cursor:default;display:grid;place-items:center;font-size:10px}
.ptgap{height:10px}
.ptdet{align-self:stretch;position:relative;padding:0 6px}.ptgrid .ptdet>*{position:absolute;inset:0 6px;overflow:auto}.ptgrid .ptempty{display:grid;place-items:center}
.ptempty{margin:auto;color:var(--muted);font-weight:600}
.ptcard{display:grid;grid-template-columns:auto minmax(0,1.15fr) minmax(0,1fr);gap:12px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);overflow:auto}
.ptbig{flex:none;width:96px;height:108px;border-radius:12px;background:var(--c);display:flex;flex-direction:column;justify-content:space-between;padding:6px 8px;color:#14213d}.ptbig i{font-style:normal;font-weight:800;font-size:14px}.ptbig b{font:800 36px/1 var(--f);text-align:center}.ptbig span{font-size:11px;text-align:center;font-weight:600}.ptbig em{font-style:normal;font-size:11px;text-align:center}
.ptinfo{flex:1;min-width:0}.ptinfo h3{margin:0 0 4px;color:var(--navy);font-size:18px}.ptinfo h3 small{color:var(--muted);font-weight:500;font-size:13px}
.ptkv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;line-height:1.3}.ptkv span{color:var(--muted)}.ptkv b{color:#14213d;font-weight:700}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
.ptpne,.ptconf,.ptuse{font-size:12px;margin-top:3px;color:#334;line-height:1.35}.ptconf code{background:#f1f5f9;padding:1px 5px;border-radius:5px;font-size:12px}.ptradio{margin-top:5px;color:#b45309;font-weight:700;font-size:12.5px}.ptbtn{margin-top:8px;padding:6px 12px;font-size:13px}
.ptc1{display:flex;flex-direction:column;align-items:center;gap:4px}.bohr{width:92px;height:92px}.bohr .orb{animation:ptspin linear infinite}@keyframes ptspin{to{transform:rotate(360deg)}}
.ptgame{display:flex;flex-direction:column;justify-content:center;text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}.ptgq small{color:var(--muted);font-weight:600}.ptgq div{font-size:20px;margin:6px 0;color:var(--navy)}.ptmsg{font-weight:700;margin:4px 0}.ptprog{height:6px;background:#eef2f8;border-radius:9px;overflow:hidden;margin-top:8px}.ptprog i{display:block;height:100%;background:#0e9aa7}.ptscore{font:800 44px var(--f);color:#0e9aa7;margin:4px 0 10px}
.ptleg{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.ptleg button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font:600 12.5px var(--f);display:flex;gap:6px;align-items:center;cursor:pointer}.ptleg button.on{border-color:#0b2a5b;background:#eef4ff}.ptleg i{width:12px;height:12px;border-radius:4px}
.ptles .ptlinks{display:flex;flex-wrap:wrap;gap:8px}.ptlinks a{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13.5px}.ptlinks a:hover{border-color:#0e9aa7}
@media (max-width:960px){.ptcard{grid-template-columns:auto 1fr}.ptx{grid-column:1/-1}}
.ptdet.mob{padding:0;margin-bottom:10px;min-height:120px}.ptdet.mob .ptgame{min-height:120px}
@media (min-width:961px) and (max-width:1320px){.search input,.search input:focus{width:190px}nav.main a{padding-left:9px;padding-right:9px;font-size:14px}.logo small{white-space:nowrap}}
@media (min-width:961px) and (max-width:1120px){.logo small{display:none}.search input,.search input:focus{width:150px}nav.main{margin-left:4px}nav.main a{padding-left:7px;padding-right:7px;font-size:13.5px}}

.page-h h1{font-size:34px;font-weight:800}
.page-h p{margin:6px 0 0;opacity:.85;max-width:720px}
.crumbs{font-size:13px;opacity:.8;margin-bottom:10px}
.crumbs a:hover{text-decoration:underline}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0 16px}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font:600 13.5px var(--f);color:#475569}
.seg button.on{background:var(--blue);color:#fff}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;padding-bottom:40px}
.lcard{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;transition:.15s}
.lcard:hover{border-color:#bcd2f7;box-shadow:var(--shadow);transform:translateY(-2px)}
.lnum{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font:800 16px var(--f);color:#fff;background:var(--blue)}
.lcard h4{font-size:15.5px;line-height:1.3;margin-bottom:6px}
.lcard .tags{display:flex;gap:6px;flex-wrap:wrap}
.lcard .tags .chip{font-size:11.5px;padding:3px 8px}
.unit-h{grid-column:1/-1;margin:14px 0 2px;font:800 15px var(--f);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}

/* lesson page */
.lesson-top{background:#fff;border-bottom:1px solid var(--line)}
.lesson-top .wrap{padding:24px 20px 0}
.lesson-top h1{font-size:32px;color:var(--navy);display:flex;gap:14px;align-items:center}
.lesson-top h1 .lnum{width:50px;height:50px;font-size:20px;border-radius:14px}
.lesson-top .sub{color:var(--muted);margin:8px 0 0}
.tabs{display:flex;gap:4px;margin-top:20px;overflow:auto}
.tabs button{border:0;background:none;padding:12px 16px;font:700 14.5px var(--f);color:#64748b;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--blue);border-color:var(--blue)}
.tabs button .cnt{background:#ffe9c7;color:#b45309;border-radius:99px;padding:1px 7px;font-size:11.5px;margin-left:5px}
.lesson-body{display:grid;grid-template-columns:1fr 300px;gap:24px;padding:26px 20px 50px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);margin-bottom:18px}
.panel h3{font-size:19px;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;gap:9px}
.keyq{display:flex;gap:14px;background:linear-gradient(135deg,#eef5ff,#f0fbf4);border:1px solid #d7e6fb;border-radius:16px;padding:16px 18px;margin-bottom:18px}
.keyq .ic{font-size:26px}
.keyq b{display:block;font:800 13px var(--f);color:var(--blue);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.prose p{margin:0 0 12px;font-size:16px;color:#1e293b}
.pts{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.pts li{position:relative;padding:12px 14px 12px 44px;background:#f8fbff;border:1px solid #e6eef9;border-radius:12px;font-size:15px}
.pts li:before{content:"✓";position:absolute;left:14px;top:11px;width:20px;height:20px;border-radius:6px;background:var(--blue);color:#fff;font-size:12px;display:grid;place-items:center;font-weight:800}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.term{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.term b{display:block;color:var(--navy);font:800 14.5px var(--f);margin-bottom:3px}
.term span{font-size:14px;color:#475569}
.fact{display:flex;gap:12px;background:#fffaf0;border:1px solid #fde7b5;border-radius:14px;padding:14px 16px}
.fact .ic{font-size:22px}
.eqbox{font:600 17px "Courier New",monospace;background:#0f1d33;color:#a5f3fc;border-radius:12px;padding:14px 16px;overflow:auto}
.side .panel{padding:18px}
.side h4{font-size:15px;margin-bottom:10px;color:var(--navy)}
.side .navl a{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:10px;font-size:13.5px;color:#334155}
.side .navl a:hover{background:var(--sky)}
.side .navl a.on{background:var(--blue);color:#fff}
.side .navl a i{font-style:normal;width:26px;height:26px;flex:none;border-radius:8px;background:#eef2f8;display:grid;place-items:center;font:800 12px var(--f);color:#475569}
.side .navl a.on i{background:rgba(255,255,255,.2);color:#fff}
.side .navl{max-height:420px;overflow:auto}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.pn a{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13.5px}
.pn a:hover{border-color:var(--blue)}
.pn a small{display:block;color:var(--muted);font-size:12px}
.pn a.r{text-align:right}

/* book pages */
.pages{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pages img{width:100%;border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow);background:#fff;cursor:zoom-in}
.note{font-size:13.5px;color:var(--muted);background:#f3f6fb;border-radius:10px;padding:10px 12px;margin-bottom:14px}
.zoom{position:fixed;inset:0;background:rgba(10,20,40,.88);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.zoom.on{display:flex}
.zoom img{max-height:96vh;max-width:96vw;border-radius:8px}

/* quiz */
.q{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.q .qt{font-weight:600;margin-bottom:10px}
.q .qa{display:flex;gap:8px}
.q .qa button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 16px;font-weight:700}
.q .qa button:hover{border-color:var(--blue)}
.q.ok{border-color:#86efac;background:#f0fdf4}.q.bad{border-color:#fca5a5;background:#fef2f2}
.q .fb{margin-top:8px;font-size:14px;font-weight:600}
.q.ok .fb{color:#15803d}.q.bad .fb{color:#b91c1c}
.score{display:flex;align-items:center;gap:12px;background:var(--sky);border-radius:14px;padding:14px 16px;font-weight:700;color:var(--navy)}

/* lab cards */
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding-bottom:40px}
.xcard{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.15s;display:flex;flex-direction:column}
.xcard:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(15,23,42,.12)}
.xcard .th{height:120px;display:grid;place-items:center;font-size:52px;background:linear-gradient(135deg,#eef5ff,#efe9ff)}
.xcard .bd{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column}
.xcard h4{font-size:15.5px;line-height:1.3;margin-bottom:6px}
.xcard p{margin:0 0 10px;font-size:13.5px;color:var(--muted);flex:1}
.xcard .go{font:700 13.5px var(--f);color:var(--purple)}
.xinline{display:flex;gap:14px;align-items:center;border:1px solid #e3d8ff;background:linear-gradient(135deg,#faf7ff,#f2f7ff);border-radius:16px;padding:14px 16px;margin-bottom:12px;cursor:pointer;transition:.15s}
.xinline:hover{border-color:var(--purple)}
.xinline .ic{font-size:30px;width:54px;height:54px;border-radius:14px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.xinline h4{font-size:15.5px}
.xinline p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.xinline .play{margin-left:auto;background:var(--purple);color:#fff;border-radius:11px;padding:9px 14px;font:700 13.5px var(--f);white-space:nowrap}

/* 3D lab viewer */
.lab-host{position:relative;display:flex;flex-direction:column;background:#0f1d33;border-radius:18px;overflow:hidden}
.lab-host:fullscreen{border-radius:0}
.lab-stage{position:relative;flex:1;min-height:300px}
.lab-stage canvas.gl{display:block;width:100%!important;height:100%!important;touch-action:none}
.lab-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab-label{position:absolute;left:0;top:0;white-space:nowrap;background:rgba(255,255,255,.92);color:#0f172a;border-radius:8px;padding:3px 8px;font:700 12px var(--f);box-shadow:0 2px 8px rgba(0,0,0,.15);transition:opacity .3s}
.lab-label.tag{background:#1f5fd6;color:#fff}
.lab-label.micro{background:#0ea5e9;color:#fff}
.lab-label.ion{background:#111827;color:#fff;font-size:12px}
.lab-label.temp{background:#ef4444;color:#fff;font-size:13px}
.lab-label.warn{background:#f59e0b;color:#111}
.lab-hint{position:absolute;right:12px;top:10px;font:600 11.5px var(--f);color:#cbd5e1;background:rgba(15,29,51,.6);border-radius:8px;padding:4px 8px;pointer-events:none}
.lab-graph{position:absolute;left:12px;top:12px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.12);width:220px;height:auto}
.lab-picker{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:96%}
.lab-picker button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#e2e8f0;border-radius:8px;padding:4px 8px;font:700 12px var(--f);min-width:34px}
.lab-picker button.on{background:#1f5fd6;border-color:#1f5fd6;color:#fff}
.lab-info{position:absolute;left:12px;top:12px;background:rgba(15,29,51,.85);color:#e2e8f0;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 12px;font:500 13px var(--f);line-height:1.6}
.lab-info b{color:#fff;font-size:15px}
.lab-err{color:#fff;display:grid;place-items:center;height:100%;font:600 15px var(--f)}
.lab-ui{background:#fff;border-top:1px solid var(--line)}
.lab-bar{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.lab-bar button{border:1px solid var(--line);background:#fff;border-radius:9px;width:36px;height:34px;font-size:14px;color:var(--navy)}
.lab-bar .lb-play{background:var(--purple);color:#fff;border-color:var(--purple);width:44px}
.lab-bar select{border:1px solid var(--line);border-radius:9px;height:34px;padding:0 6px;font:600 13px var(--f);background:#fff}
.lb-track{position:relative;flex:1;height:8px;background:#eef2f8;border-radius:99px;cursor:pointer;margin:0 6px}
.lb-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#7c3aed,#1f5fd6);border-radius:99px}
.lb-ticks i{position:absolute;top:-3px;width:3px;height:14px;background:#cbd5e1;border-radius:2px}
.lab-cap{padding:14px 16px;min-height:96px}
.lc-step{font:800 11.5px var(--f);color:var(--purple);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.lc-text{font-size:15.5px;color:#1e293b}
.lc-eq{margin-top:10px;font:700 15px "Courier New",monospace;background:#0f1d33;color:#a5f3fc;border-radius:10px;padding:9px 12px;display:inline-block}
.labpage .lab-host{height:min(78vh,760px)}
.labpage .lab-stage{min-height:0}
.lab-modal{position:fixed;inset:0;background:rgba(8,15,30,.7);z-index:90;display:none;align-items:center;justify-content:center;padding:18px}
.lab-modal.on{display:flex}
.lab-modal .box{width:min(1100px,100%);height:min(88vh,800px);background:#fff;border-radius:20px;display:flex;flex-direction:column;overflow:hidden}
.lab-modal .mh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.lab-modal .mh h3{font-size:17px;flex:1}

.lab-modal .lab-host{flex:1;border-radius:0;min-height:0}
.safety{display:flex;gap:10px;font-size:13.5px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px 12px;margin-top:14px}

/* reader */
.reader{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px 0 40px}
.reader .spread{display:flex;gap:10px;justify-content:center;width:100%}
.reader .spread img{width:min(48%,560px);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.15);background:#fff}
.reader .trspread{align-items:flex-start}.reader .trspread .trpage{width:min(48%,560px);margin:0;text-align:left}.reader .trspread img{align-self:flex-start}@media(max-width:820px){.reader .spread{flex-direction:column;align-items:center}.reader .trspread .trpage,.reader .spread img{width:100%}}
.reader .ctl{display:flex;gap:10px;align-items:center}
.reader .ctl input{width:70px;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font:600 14px var(--f)}


/* tests */
.page-h.tests{background:linear-gradient(135deg,#7c2d12,#ea580c)}
.dchip{display:inline-flex;align-items:center;border-radius:99px;padding:3px 10px;font:700 12px var(--f);margin-right:6px}
.dchip.easy{background:#dcfce7;color:#15803d}.dchip.medium{background:#fef3c7;color:#b45309}.dchip.hard{background:#fee2e2;color:#b91c1c}
.bankline{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:14px;font-size:14px}
.bankline small{color:var(--muted)}
.tsetup{display:grid;grid-template-columns:1fr 360px;gap:20px;padding:24px 0 40px}
.ts-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.big{width:100%;justify-content:center;padding:14px;font-size:16px}
.tlist{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.tg-h{font:800 15px var(--f);color:var(--navy);margin:10px 0 4px}
.tu-h{font:800 11.5px var(--f);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:10px 0 4px}
.tl{display:flex;gap:10px;align-items:center;padding:6px 6px;border-radius:9px;font-size:14px;cursor:pointer}
.tl:hover{background:var(--sky)}
.tl input{width:17px;height:17px;accent-color:var(--blue)}
.lnum.s{width:26px;height:26px;font-size:12px;border-radius:8px}
.ts-f{margin-bottom:16px}.ts-f label{display:block;font:700 13px var(--f);color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.ts-f .seg{flex-wrap:wrap}
.modes label{display:flex!important;gap:8px;align-items:center;text-transform:none!important;letter-spacing:0!important;font:500 14px var(--f)!important;color:var(--ink)!important;margin-bottom:6px!important;cursor:pointer}
.terr{color:#b91c1c;font-weight:600;margin-top:8px;font-size:14px}
.hist{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.tr-panel{margin-top:24px;max-width:860px;margin-left:auto;margin-right:auto}
.tr-top{display:flex;align-items:center;gap:12px;font:700 13.5px var(--f);color:var(--muted);margin-bottom:12px}
.tr-prog{flex:1;height:8px;background:#eef2f8;border-radius:99px;overflow:hidden}.tr-prog div{height:100%;background:linear-gradient(90deg,#16a34a,#1f5fd6);transition:width .3s}
.tm-box{background:#fff7ed;color:#c2410c;border-radius:9px;padding:4px 10px}
.tr-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tr-topic{font-size:13px;color:var(--blue);font-weight:600}
.tr-q{font:700 19px var(--f);color:var(--ink);line-height:1.4;margin-bottom:16px}
.tr-q small{display:block;font:700 12px var(--f);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.tr-opts{display:grid;gap:10px}
.tr-opts.tf{grid-template-columns:1fr 1fr}
.tr-opts button{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font:500 15.5px var(--f);color:var(--ink);transition:.15s}
.tr-opts button:hover:not(:disabled){border-color:#93b4ef;background:#f6f9ff}
.tr-opts button i{font-style:normal;width:30px;height:30px;flex:none;border-radius:9px;background:#eef2f8;display:grid;place-items:center;font:800 14px var(--f);color:#475569}
.tr-opts button.sel{border-color:var(--blue);background:#eef4ff}.tr-opts button.sel i{background:var(--blue);color:#fff}
.tr-opts button.ok{border-color:#22c55e;background:#f0fdf4}.tr-opts button.ok i{background:#22c55e;color:#fff}
.tr-opts button.bad{border-color:#ef4444;background:#fef2f2}.tr-opts button.bad i{background:#ef4444;color:#fff}
.tr-opts button:disabled{cursor:default}
.tr-fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-weight:600;font-size:14.5px}
.tr-fb.ok{background:#f0fdf4;color:#15803d}.tr-fb.bad{background:#fef2f2;color:#b91c1c}
.tr-nav{display:flex;align-items:center;gap:10px;margin-top:18px}
.tr-nav .btn:disabled{opacity:.4;cursor:default}
.tr-pal{flex:1;display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.tr-pal button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font:700 12px var(--f);color:#475569}
.tr-pal button.done{background:#dbeafe;border-color:#93c5fd}.tr-pal button.okk{background:#dcfce7;border-color:#86efac}.tr-pal button.badd{background:#fee2e2;border-color:#fca5a5}
.tr-pal button.cur{outline:2px solid var(--blue);outline-offset:1px}
.res-top{display:flex;gap:24px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.ring{--p:0;width:130px;height:130px;border-radius:50%;background:conic-gradient(#16a34a calc(var(--p)*1%),#eef2f8 0);display:grid;place-items:center;position:relative;flex:none}
.ring:before{content:"";position:absolute;inset:12px;background:#fff;border-radius:50%}
.ring b,.ring small{position:relative;display:block;text-align:center}.ring b{font:800 28px var(--f);color:var(--navy);margin-top:30px}.ring small{color:var(--muted);margin-top:-30px}
.res-top h3{font-size:22px;color:var(--navy)}.res-mark{color:var(--muted);margin:6px 0 12px}
.res-mark b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;color:#fff}.m5{background:#16a34a}.m4{background:#1f5fd6}.m3{background:#f59e0b}.m2{background:#ef4444}
.tr-res h4{font:800 15px var(--f);color:var(--navy);margin:18px 0 10px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}.bar .dchip{width:90px;justify-content:center}.bt{flex:1;height:10px;background:#eef2f8;border-radius:99px;overflow:hidden}.bf{height:100%}.bf.easy{background:#22c55e}.bf.medium{background:#f59e0b}.bf.hard{background:#ef4444}
.top-row{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:13.5px}

.rev-i{border:1px solid var(--line);border-left:4px solid #22c55e;border-radius:12px;padding:12px 14px;margin-bottom:8px}.rev-i.bad{border-left-color:#ef4444}
.rev-h{display:flex;gap:8px;align-items:flex-start}.rev-h .num{font:800 13px var(--f);color:var(--muted);min-width:20px}.rev-q{font-weight:600;font-size:14.5px}

.rev-l{display:inline-block;margin:6px 0 0 28px;font-size:13px;color:var(--blue);font-weight:600}
/* translated pages */

.trpages{display:grid;gap:18px}
.trpage{border:1px solid var(--line);border-radius:14px;padding:20px 22px;background:linear-gradient(180deg,#fbfdff,#fff);box-shadow:var(--shadow);font-size:15px}
.trp-h{display:flex;justify-content:space-between;font:800 11.5px var(--f);letter-spacing:.06em;color:#fff;background:linear-gradient(90deg,#0b2a5b,#1f5fd6);margin:-20px -22px 16px;padding:9px 16px;border-radius:14px 14px 0 0}
.trpage h2{font-size:24px;color:var(--navy);margin-bottom:10px}
.trpage h3{font-size:16px;color:#fff;background:var(--blue);display:inline-block;padding:4px 12px;border-radius:8px;margin:14px 0 8px}

@media (max-width:960px){.tsetup{grid-template-columns:1fr}.tr-opts.tf{grid-template-columns:1fr}}
footer{background:#0b2a5b;color:#c7d6f2;padding:28px 0;margin-top:20px;font-size:14px}

  .gcard{flex-direction:column;align-items:flex-start}.gcard img{width:100px}

  .search input{width:40px;padding:9px 6px 9px 30px;color:transparent;cursor:pointer}.search input::placeholder{color:transparent}.search input:focus{position:fixed;left:10px;right:10px;top:12px;width:auto;color:var(--ink,#0f172a);cursor:text;z-index:60;padding-left:34px;box-shadow:var(--shadow)}.search input:focus::placeholder{color:#94a3b8}.sres{position:fixed;left:10px;right:10px;top:60px;width:auto;z-index:60}
  .lesson-top h1{font-size:24px}.labpage .lab-host{height:82vh}

}
/* ===== Theme C — playful & bright ===== */
:root{
  --f:'Nunito','Segoe UI Rounded','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  --navy:#2d2240; --ink:#2d2240; --muted:#7a6e8c; --line:#f0e3cf; --bg:#fff8ee; --card:#fff;
  --blue:#f26b0f; --sky:#fff0e1; --green:#22c55e; --mint:#e6f9ee; --orange:#ffb21a; --purple:#8b5cf6;
  --pri:#ff7a1a; --pri-d:#d95800; --r:22px;
  --shadow:0 4px 0 #f0e3cf;
}
body{font-family:var(--f);background:var(--bg);color:var(--ink)}
h1,h2,h3,h4{font-family:var(--f);font-weight:900;letter-spacing:-.005em}
button,input,select,textarea{font-family:var(--f)}
/* header */
header.top{background:rgba(255,255,255,.92);border-bottom:2px solid var(--line)}
.logo{font-weight:900}
.logo .mark{border-radius:14px;background:linear-gradient(135deg,#ff7a1a,#ff4d8d);box-shadow:0 3px 0 #c9461b;transform:rotate(-6deg)}
nav.main a{font-weight:800;color:#5b4f6e;border-radius:12px}
nav.main a.on,nav.main a:hover{background:var(--sky);color:var(--pri-d)}
.search input{border:2px solid var(--line);background:#fffaf3;border-radius:14px}
.search input:focus{border-color:var(--pri)}
.lang{background:#fff3e6;border-radius:12px}.lang button.on{color:var(--pri-d)}
.xpw{display:flex;align-items:center;gap:4px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:3px 4px 3px 8px;box-shadow:0 3px 0 var(--line);font-weight:900;font-size:14px;color:var(--navy);white-space:nowrap;transition:.15s}
.xpw:hover{transform:translateY(-1px);border-color:#ffc58f}
.xpw span{display:flex;align-items:center;gap:2px}.xpw .xs{filter:grayscale(1);opacity:.55}.xpw .xs.on{filter:none;opacity:1}
.xpw .xs b{color:#ea580c}.xpw .xx b{color:#a16207;margin-right:4px}
.xpw .xl{--p:0;width:30px;height:30px;border-radius:50%;background:conic-gradient(#8b5cf6 calc(var(--p)*1%),#ede7fb 0);display:grid;place-items:center;position:relative}
.xpw .xl:before{content:"";position:absolute;inset:4px;border-radius:50%;background:#fff}.xpw .xl b{position:relative;font-size:12px;color:#6d28d9}
/* buttons */
.btn{border-radius:16px;font-weight:900;letter-spacing:.01em;box-shadow:0 4px 0 var(--sh,#e5d5bd);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover{filter:brightness(1.04);transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sh,#e5d5bd)}
.btn.pri{background:var(--pri);--sh:var(--pri-d);color:#fff}
.btn.grn{background:#22c55e;--sh:#16a34a;color:#fff}
.btn.sec{background:#fff;border:2px solid var(--line);--sh:var(--line);color:var(--navy)}
.btn:disabled{opacity:.45;transform:none;box-shadow:0 2px 0 var(--sh,#e5d5bd)}
/* hero */
